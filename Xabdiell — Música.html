<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Xabdiell — Música</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400;600&display=swap"><style id="css">
:root{
  --bg:#f3ece8; --ink:#150b0b; --muted:#6b5552; --line:#dbcac5; --card:#e9dcd7; --red:#c4160f; --ember:#e8590c; --btn-ink:#fff;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b0707;--ink:#f4ebe6;--muted:#a8918c;--line:#2e1b1a;--card:#1a0f0e;--red:#e5251b;--ember:#ff7a2e;--btn-ink:#fff}}
:root[data-theme="dark"]{--bg:#0b0707;--ink:#f4ebe6;--muted:#a8918c;--line:#2e1b1a;--card:#1a0f0e;--red:#e5251b;--ember:#ff7a2e;--btn-ink:#fff}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.6 Archivo,system-ui,-apple-system,"Segoe UI",sans-serif}
h1,h2,h3{font-family:Anton,Impact,"Arial Narrow Bold",sans-serif;font-weight:400;line-height:1;margin:0;letter-spacing:.01em}
a{color:inherit}
:focus-visible{outline:3px solid var(--ember);outline-offset:3px}
.wrap{max-width:880px;margin:0 auto;padding:0 22px}
nav{display:flex;gap:20px;justify-content:flex-end;padding:18px 0;font-size:15px}
nav a{text-decoration:none;color:var(--muted)}
nav a:hover{color:var(--ink)}
.hero{padding:5vh 0 7vh}
.hero h1{font-size:clamp(64px,22vw,210px);color:var(--red);text-transform:uppercase;overflow-wrap:anywhere;animation:flick 5s steps(1) 1 both}
@keyframes flick{0%{opacity:0}6%{opacity:1}9%{opacity:.35}12%{opacity:1}100%{opacity:1}}
.hero p{max-width:36ch;font-size:20px;color:var(--muted);margin:16px 0 26px}
.btn{display:inline-block;background:var(--red);color:var(--btn-ink);font-weight:600;padding:13px 26px;border-radius:4px;text-decoration:none}
.btn:hover{background:var(--ember)}
.stats{display:flex;flex-wrap:wrap;gap:12px 44px;margin-top:40px}
.stats b{display:block;font-family:Anton,Impact,sans-serif;font-weight:400;font-size:clamp(34px,8vw,52px);line-height:1}
.stats span{color:var(--muted);font-size:15px}
section{padding:46px 0;border-top:1px solid var(--line)}
h2{font-size:clamp(34px,7vw,52px);margin-bottom:8px;text-transform:uppercase}
.sub{color:var(--muted);margin:0 0 24px}
.track{display:grid;grid-template-columns:96px 1fr;gap:18px;align-items:center;padding:12px;background:var(--card);margin-bottom:12px}
.track img{width:96px;height:96px;object-fit:cover;display:block}
.track h3{font-size:26px;text-transform:uppercase}
.track small{display:block;color:var(--muted);margin-top:4px}
.listen{color:var(--ember);font-weight:600}
.track em{font-style:normal;color:var(--ember);font-weight:600}
.about p{margin:0 0 14px;max-width:60ch}
.note{font-size:14px;color:var(--muted);border:1px dashed var(--line);padding:12px 14px;margin-top:24px}
footer{padding:36px 0 50px;color:var(--muted);font-size:15px;border-top:1px solid var(--line)}
footer .links{display:flex;flex-wrap:wrap;gap:18px;margin-top:10px}
@media (prefers-reduced-motion:reduce){.hero h1{animation:none}}
@media (max-width:420px){.track{grid-template-columns:78px 1fr}.track img{width:78px;height:78px}.track h3{font-size:22px}}

.nocover{width:96px;height:96px;background:var(--line)}
.panel{border-top:1px solid var(--line);padding:30px 0}
.panel label{display:block;font-size:15px;color:var(--muted);margin:0 0 14px}
.panel input,.panel textarea{display:block;width:100%;margin-top:6px;padding:11px 12px;font:16px Archivo,system-ui,sans-serif;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:4px}
.panel input[type=file]{border:0;padding-left:0}
.prev{width:96px;height:96px;object-fit:cover;display:block;margin:0 0 14px}
.rowbtns{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
button{font:600 15px Archivo,system-ui,sans-serif;padding:9px 16px;border-radius:4px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}
button.primary{background:var(--red);border-color:var(--red);color:var(--btn-ink)}
.adminbar{position:fixed;left:0;right:0;bottom:0;display:flex;gap:10px;align-items:center;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));background:var(--card);border-top:1px solid var(--line);z-index:5}
.adminbar span{flex:1;font-size:14px;color:var(--muted)}
#root{padding-bottom:84px}

.btnlike{display:inline-block;font:600 15px Archivo,system-ui,sans-serif;padding:9px 16px;border-radius:4px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer;margin:0}
.codebtn{margin-top:18px;font-size:13px;padding:5px 12px;color:var(--muted)}
.codebox{display:flex;gap:8px;margin-top:18px;max-width:280px}
.codebox input{flex:1;min-width:0;padding:9px 12px;font:16px Archivo,system-ui,sans-serif;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:4px}

.year{font-family:Anton,Impact,sans-serif;font-weight:400;color:var(--ember);font-size:26px;margin:30px 0 12px}
.badge{display:inline-block;background:var(--red);color:#fff;font:600 12px Archivo,system-ui,sans-serif;text-transform:uppercase;padding:3px 8px;margin-left:10px;vertical-align:middle;letter-spacing:.04em}
.track audio{width:100%;margin:10px 0 4px}
.btn.sm{padding:9px 18px;font-size:15px;margin-top:8px}
.err{color:var(--ember);font-weight:600;min-height:1.2em;margin:6px 0}
.panel select{display:block;width:100%;margin-top:6px;padding:11px 12px;font:16px Archivo,system-ui,sans-serif;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:4px}
section .rowbtns .btn.sm{margin-top:0}
/* ===== Estilo 3D cristal / desierto ===== */
:root{--glass:rgba(255,255,255,.32);--glass-brd:rgba(255,255,255,.5);--ink:#1b1512;--muted:#4a3b33;--line:rgba(255,255,255,.38);--card:rgba(255,255,255,.24);--bg:rgba(255,255,255,.55);--red:#18120f;--btn-ink:#fff;--ember:#b4532a;--shadow:rgba(40,20,10,.22);
--scene:radial-gradient(ellipse 60% 30% at 85% 52%,rgba(255,196,150,.6),transparent 70%),radial-gradient(ellipse 45% 14% at 6% 70%,#6e4a3a 0,transparent 72%),radial-gradient(ellipse 60% 10% at 30% 100%,#8a5a45,transparent 75%),radial-gradient(ellipse 80% 22% at 85% 100%,#b27a5d,transparent 72%),linear-gradient(180deg,#59606c 0%,#8d8f9b 24%,#c7a99f 44%,#d8a886 58%,#9a6650 74%,#4c3229 100%)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--glass:rgba(22,15,13,.46);--glass-brd:rgba(255,255,255,.16);--ink:#f6ece6;--muted:#cdb9ae;--line:rgba(255,255,255,.14);--card:rgba(255,255,255,.07);--bg:rgba(0,0,0,.38);--red:#f4e9e2;--btn-ink:#18120f;--ember:#ff9a5c;--shadow:rgba(0,0,0,.5);
--scene:radial-gradient(ellipse 60% 30% at 85% 52%,rgba(255,140,90,.28),transparent 70%),radial-gradient(ellipse 45% 14% at 6% 70%,#3a2620 0,transparent 72%),radial-gradient(ellipse 60% 10% at 30% 100%,#46281f,transparent 75%),radial-gradient(ellipse 80% 22% at 85% 100%,#5a3326,transparent 72%),linear-gradient(180deg,#0f1118 0%,#241f2b 30%,#3f2d33 52%,#4a2f27 68%,#150e0c 100%)}}
:root[data-theme="dark"]{--glass:rgba(22,15,13,.46);--glass-brd:rgba(255,255,255,.16);--ink:#f6ece6;--muted:#cdb9ae;--line:rgba(255,255,255,.14);--card:rgba(255,255,255,.07);--bg:rgba(0,0,0,.38);--red:#f4e9e2;--btn-ink:#18120f;--ember:#ff9a5c;--shadow:rgba(0,0,0,.5)}
html{background:#3a2a26}
body{background:transparent}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:var(--scene)}
nav{position:relative;flex-wrap:wrap;gap:6px 18px;align-items:center;margin:14px 0;padding:14px 24px;background:var(--glass);border:1px solid var(--glass-brd);border-radius:30px;-webkit-backdrop-filter:blur(22px) saturate(1.3);backdrop-filter:blur(22px) saturate(1.3);box-shadow:0 14px 36px var(--shadow),inset 0 1px 0 rgba(255,255,255,.4)}
nav::before{content:"XABDIELL\00AE";margin-right:auto;font-family:Anton,Impact,sans-serif;font-size:22px;letter-spacing:.04em;color:var(--ink)}
nav a{color:var(--ink);font-weight:600;font-size:14px}
.hero,section{position:relative;background:var(--glass);border:1px solid var(--glass-brd);border-radius:34px;-webkit-backdrop-filter:blur(24px) saturate(1.3);backdrop-filter:blur(24px) saturate(1.3);box-shadow:0 24px 56px var(--shadow),inset 0 1px 0 rgba(255,255,255,.45);margin:18px 0;padding:30px 24px}
.hero{padding:44px 26px 48px;margin-top:8px}
section.panel{padding:28px 24px;border:1px solid var(--glass-brd)}
.hero h1{color:var(--ink);font-size:clamp(56px,18vw,170px);text-shadow:0 2px 0 rgba(255,255,255,.35),0 18px 40px var(--shadow)}
.hero p{color:var(--muted)}
h2{color:var(--ink)}
.btn{display:inline-flex;align-items:center;gap:14px;background:var(--red);color:var(--btn-ink);border-radius:999px;padding:8px 8px 8px 24px;box-shadow:0 10px 24px var(--shadow)}
.btn::after{content:"\2197";width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:rgba(128,128,128,.28);font-size:16px}
.btn.sm{padding:6px 6px 6px 18px}
.btn.sm::after{width:30px;height:30px}
.btn:hover{background:var(--ember);color:#fff}
.track{background:var(--card);border:1px solid var(--glass-brd);border-radius:26px;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);box-shadow:0 14px 30px var(--shadow);transition:transform .35s ease,box-shadow .35s ease;transform-style:preserve-3d}
.track:hover{transform:perspective(900px) rotateX(3deg) rotateY(-4deg) translateY(-5px);box-shadow:0 26px 44px var(--shadow)}
.track img,.nocover{border-radius:20px;box-shadow:0 12px 26px var(--shadow),0 0 0 1px rgba(255,255,255,.35)}
.track audio{border-radius:999px}
.year{color:var(--ink);opacity:.85}
.badge{border-radius:999px;padding:3px 10px;background:var(--red);color:var(--btn-ink)}
.panel input,.panel textarea,.panel select{background:var(--bg);color:var(--ink);border:1px solid var(--glass-brd);border-radius:16px}
button,.btnlike{background:var(--bg);color:var(--ink);border:1px solid var(--glass-brd);border-radius:999px}
button.primary{background:var(--red);color:var(--btn-ink);border-color:var(--red)}
footer{background:var(--glass);border:1px solid var(--glass-brd);border-radius:30px;-webkit-backdrop-filter:blur(22px);backdrop-filter:blur(22px);margin:18px 0;padding:22px 24px;color:var(--muted);box-shadow:0 14px 36px var(--shadow)}
footer a{color:var(--ink)}
.codebox input{background:var(--bg);color:var(--ink);border:1px solid var(--glass-brd);border-radius:999px;padding:9px 16px}
.adminbar{left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));padding:10px 12px 10px 20px;border-radius:999px;background:var(--glass);border:1px solid var(--glass-brd);-webkit-backdrop-filter:blur(22px);backdrop-filter:blur(22px);box-shadow:0 14px 36px var(--shadow)}
.hero::before,.hero::after,#musica::after,#ineditas::after{content:"";position:absolute;pointer-events:none;z-index:2;background-repeat:no-repeat;background-size:contain;background-position:center;filter:drop-shadow(0 14px 18px rgba(0,0,0,.65));animation:bob 7s ease-in-out infinite}

</style></head><body><div id="root"></div><script type="application/json" id="data">{"tagline":"We trust in God","bio":"Xabdiell is one of the most enigmatic, influential and at the same time silent figures of the recent underground music scene.\n\nBorn in San Juan (Ashford)\n\nResidence Residential Lagos de Blasina\n\nCarolina, Puerto Rico. 📍\n\nHis figure moves between urban legend and the deep respect of those who know the foundations of the new musical wave.\n\nReserved by nature, deeply spiritual and with a personality distrustful of the intentions of others, Xabdiell has preferred to stay in the mystery rather than seek mass exposure.\n\nAmong his relatives and followers of the underground movement, he is popularly known by such dark nicknames as \"babalau\" said nickname was created by his cousin, \"the devil's doll\", a reflection of his cryptic aura and his connection with the occult.\n\nThere is something particularly curious and unique about its status: every year that passes is as if it were established, but without being \"stuck\" in the traditional commercial sense.\n\nDespite being out of the spotlight and the massive circuits of the industry, its name and cultural weight do not fade; they remain in force in an almost ghostly way, respected by the undersellood as an invisible pillar that never ends up leaving completely.\n\nLong before street trap and bars about crudeness and violence dominated the charts with massive exponents such as Young Chimi, Sombra, pressure9X19, CDobleta and Xabdiell were marking the ground.\n\nThe pioneer of SoundCloud: He was one of the first to dare to sing and rap with strength and crudeness about explicit violence and street experiences on the SoundCloud platform. He also viralized a song of heartbreak called \"I miss you\" in a video by Bart Simpson some time ago.\n\nThe spark of a generation: Its raw, unfiltered and visceral style served as a catalyst and mold for a large number of emerging artists who were looking for a new sound identity.\n\nXabdiell's influence on urban music is undeniable, although bittersweet. For many current musicians, he represents the original inspiration of a style that is mainstream today.\n\nHowever, the musical landscape has its dark side because while some openly recognize his legacy, others have limited themselves to copying his style, taking advantage of his current personal situation and his temporary withdrawal from the spotlight to appropriate elements that he popularized first.\n\nCurrently, Xabdiell is out of his musical career, focused on his privacy and away from the noise of the industry.","email":"xabdielpr@gmail.com","links":{"spotify":"https://open.spotify.com/intl-es/artist/7rg8z8hS3eB3i9jShD7bfm","instagram":"https://www.instagram.com/xabdielll?obrf=MXgyNjJ3aGdnaG9ocg%3D%3D&utm_source=qr","youtube":"https://youtube.com/@babalaux?si=U3ulFa_NHpGAdJwi","tiktok":""},"songs":[{"id":1792349482926,"title":"20/E","artist":"Xabdiell","year":"2023","url":"https://open.spotify.com/track/2qtZQMXPLDlH9KV69Lyeyr","cover":"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAASABIAAD/4QBMRXhpZgAATU0AKgAAAAgAAYdpAAQAAAABAAAAGgAAAAAAA6ABAAMAAAABAAEAAKACAAQAAAABAAAA3KADAAQAAAABAAAA3AAAAAD/7QA4UGhvdG9zaG9wIDMuMAA4QklNBAQAAAAAAAA4QklNBCUAAAAAABDUHYzZjwCyBOmACZjs+EJ+/8AAEQgA3ADcAwEiAAIRAQMRAf/EAB8AAAEFAQEBAQEBAAAAAAAAAAABAgMEBQYHCAkKC//EALUQAAIBAwMCBAMFBQQEAAABfQECAwAEEQUSITFBBhNRYQcicRQygZGhCCNCscEVUtHwJDNicoIJChYXGBkaJSYnKCkqNDU2Nzg5OkNERUZHSElKU1RVVldYWVpjZGVmZ2hpanN0dXZ3eHl6g4SFhoeIiYqSk5SVlpeYmZqio6Slpqeoqaqys7S1tre4ubrCw8TFxsfIycrS09TV1tfY2drh4uPk5ebn6Onq8fLz9PX29/j5+v/EAB8BAAMBAQEBAQEBAQEAAAAAAAABAgMEBQYHCAkKC//EALURAAIBAgQEAwQHBQQEAAECdwABAgMRBAUhMQYSQVEHYXETIjKBCBRCkaGxwQkjM1LwFWJy0QoWJDThJfEXGBkaJicoKSo1Njc4OTpDREVGR0hJSlNUVVZXWFlaY2RlZmdoaWpzdHV2d3h5eoKDhIWGh4iJipKTlJWWl5iZmqKjpKWmp6ipqrKztLW2t7i5usLDxMXGx8jJytLT1NXW19jZ2uLj5OXm5+jp6vLz9PX29/j5+v/bAEMAAgICAgICAwICAwQDAwMEBgQEBAQGBwYGBgYGBwkHBwcHBwcJCQkJCQkJCQoKCgoKCgwMDAwMDg4ODg4ODg4ODv/bAEMBAgICAwMDBgMDBg function readSettings(){
  ['tagline','bio','email','whatsapp','paypal'].forEach(function(k){var v=val('f-'+k);if(v!==null)state[k]=v});
  ['spotify','instagram','youtube','tiktok'].forEach(function(n){var v=val('f-'+n);if(v!==null)state.links[n]=v});
}
function card(g){
  var p=g.price||{},ins=g.kind==='inedita',meta=[g.artist,fmt(g)].filter(Boolean).map(esc).join(' · '),pl=payLink(g);
  var h='<article class="track">'+(g.cover?'<img src="'+esc(g.cover)+'" alt="Portada de '+esc(g.title)+'" width="96" height="96">':'<div class="nocover" aria-hidden="true"></div>')+'<div><h3>'+esc(g.title)+(ins?'<span class="badge">Inédita</span>':'')+'</h3>'+(meta?'<small>'+meta+'</small>':'');
  if(g.url)h+='<small><a class="listen" href="'+url(g.url)+'" target="_blank" rel="noopener">'+(ins?'Escuchar':'Escuchar en Spotify')+'</a></small>';
  {
    if(g.audio&&p.mode!=='fijo')h+='<audio controls preload="none" src="'+esc(g.audio)+'"></audio>';
    if(p.mode==='gratis'){h+='<small>Gratis</small>';if(g.audio)h+='<a class="btn sm" href="'+esc(g.audio)+'" download>Descargar gratis</a>'}
    else if(p.mode==='fijo'){h+='<small>Precio: $'+esc(p.amount)+' '+esc(p.cur||'USD')+'</small>';if(pl)h+='<a class="btn sm" href="'+esc(pl)+'" target="_blank" rel="noopener">Comprar con PayPal</a><small>Después del pago te envío la canción.</small>'}
    else if(p.mode==='libre'){h+='<small>Paga lo que quieras</small>';if(pl)h+='<a class="btn sm" href="'+esc(pl)+'" target="_blank" rel="noopener">Apoyar con PayPal</a>'}
  }
  if(canEdit&&editing)h+='<div class="rowbtns"><button data-act="del" data-id="'+g.id+'">Borrar</button><label class="btnlike">Cambiar portada<input type="file" accept="image/*" data-cover="'+g.id+'" hidden></label></div>';
  return h+'</div></article>';
}
function render(){
  var s=state,list=s.songs.slice().sort(function(a,b){var x=key(a),y=key(b);return x<y?-1:x>y?1:a.id-b.id});
  var main=(list.filter(function(g){return g.kind!=='inedita'&&g.url}).pop()||{}).url||s.links.spotify;
  var h='<div class="wrap"><nav aria-label="Principal"><a href="#musica">Música</a>'+(s.songs.some(function(g){return g.kind==='inedita'})?'<a href="#ineditas">Inéditas</a>':'')+(s.bio?'<a href="#bio">Bio</a>':'')+((s.email||s.whatsapp)?'<a href="#contacto">Contacto</a>':'')+'</nav>';
  h+='<header class="hero"><h1>Xabdiell</h1><p>'+esc(s.tagline)+'</p>'+(main?'<a class="btn" href="'+url(main)+'" target="_blank" rel="noopener">Escuchar en Spotify</a>':'')+'</header>';
  if(canEdit&&editing)h+=panel();
  h+='<section id="musica"><h2>Música</h2><p class="sub">De 2020 a hoy.</p>';
  var rel=list.filter(function(g){return g.kind!=='inedita'}),ine=list.filter(function(g){return g.kind==='inedita'});
  function group(a){var o='',yr='';a.forEach(function(g){var y=key(g).slice(0,4);if(y!==yr){yr=y;o+='<h3 class="year">'+(y==='0000'?'Sin fecha':esc(y))+'</h3>'}o+=card(g)});return o}
  if(!rel.length)h+='<p class="sub">Aún no hay canciones.</p>';
  h+=group(rel)+'</section>';
  if(ine.length||(canEdit&&editing))h+='<section id="ineditas"><h2>Inéditas</h2><p class="sub">Temas que todavía no salen en plataformas.</p>'+(ine.length?group(ine):'<p class="sub">Aún no hay inéditas.</p>')+'</section>';
  if(s.bio)h+='<section id="bio"><h2>Bio</h2><div class="about">'+s.bio.split(/\n\s*\n/).map(function(p){return '<p>'+esc(p)+'</p>'}).join('')+'</div></section>';
  if(s.email||s.whatsapp){
    var wa=String(s.whatsapp).replace(/\D/g,'');
    h+='<section id="contacto"><h2>Escríbeme</h2><p class="sub">Shows, colaboraciones, entrevistas y canciones inéditas.</p><div class="rowbtns">'
     +(wa?'<a class="btn sm" href="https://wa.me/'+wa+'?text='+encodeURIComponent('Hola Xabdiell, te escribo desde tu página.')+'" target="_blank" rel="noopener">WhatsApp</a>':'')
     +(s.links.instagram?'<a class="btn sm" href="'+url(s.links.instagram)+'" target="_blank" rel="noopener">Instagram</a>':'')
     +(s.email?'<a class="btn sm" href="mailto:'+esc(s.email)+'">'+esc(s.email)+'</a>':'')+'</div></section>';
  }
  var L=[['Spotify',s.links.spotify],['Instagram',s.links.instagram],['YouTube',s.links.youtube],['TikTok',s.links.tiktok]].filter(function(x){return x[1]});
  h+='<footer><div>© 2026 Xabdiell</div>'+(L.length?'<div class="links">'+L.map(function(x){return '<a href="'+url(x[1])+'" target="_blank" rel="noopener">'+x[0]+'</a>'}).join('')+'</div>':'')+(canEdit?'':(codeOpen?'<div class="codebox"><input id="code-in" type="password" inputmode="numeric" placeholder="Código" autocomplete="off"><button data-act="unlock">Entrar</button></div>':'<button class="codebtn" data-act="code">Code</button>'))+'</footer></div>';
  if(canEdit)h+='<div class="adminbar"><span>'+(msgText?esc(msgText):'Modo editor')+'</span><button data-act="toggle">'+(editing?'Cerrar':'Editar')+'</button><button class="primary" data-act="save">Guardar y publicar</button></div>';
  root.innerHTML=h;
}
function panel(){
  var s=state;
  return '<section class="panel"><h2>Nueva canción</h2>'
  +'<label>Tipo<select id="n-kind"><option value="lanzada">Ya salió en Spotify</option><option value="inedita">Inédita (de mis archivos)</option></select></label>'
  +'<label>Título<input id="n-title" autocomplete="off"></label><label>Artista(s)<input id="n-artist" value="Xabdiell" autocomplete="off"></label>'
  +'<label>Fecha de salida o de creación<input id="n-date" type="date" min="2020-01-01"></label>'
  +'<label>Link (Spotify u otra plataforma; opcional en inéditas)<input id="n-url" type="url" placeholder="https://..." autocomplete="off"></label>'
  +'<label>Portada (opcional: si no subes una, se genera automática)<input id="n-cover" type="file" accept="image/*"></label><img id="n-prev" class="prev" alt="" hidden>'
  +'<p class="sub" style="margin:18px 0 8px"><b>Precio y audio (opcional)</b></p>'
  +'<label>Precio<select id="n-mode"><option value="ninguno">Sin precio</option><option value="gratis">Gratis</option><option value="fijo">Precio fijo</option><option value="libre">Paga lo que quieras</option></select></label>'
  +'<label>Monto (solo precio fijo)<input id="n-amt" inputmode="decimal" placeholder="50"></label><label>Moneda<select id="n-cur"><option>MXN</option><option>USD</option></select></label>'
  +'<label>Archivo de audio (gratis o paga lo que quieras; máx. 20 MB)<input id="n-audio" type="file" accept="audio/*,.mp3,.m4a,.wav,.aac,.ogg,.flac"></label>'
  +'<p class="err" id="n-msg" role="status"></p><button class="primary" data-act="add">Añadir canción</button>'
  +'<h2 style="margin-top:34px">Ajustes</h2><label>Frase de portada<input id="f-tagline" value="'+esc(s.tagline)+'"></label><label>Bio (separa párrafos con una línea en blanco)<textarea id="f-bio" rows="6">'+esc(s.bio)+'</textarea></label>'
  +'<label>Correo de contacto<input id="f-email" type="email" value="'+esc(s.email)+'"></label><label>WhatsApp (con lada, ej. 5219981234567)<input id="f-whatsapp" inputmode="tel" value="'+esc(s.whatsapp)+'"></label>'
  +'<label>Tu usuario de PayPal.Me (ej. xabdiell)<input id="f-paypal" value="'+esc(s.paypal)+'"></label>'
  +'<label>Perfil de Spotify<input id="f-spotify" value="'+esc(s.links.spotify||'')+'"></label><label>Instagram<input id="f-instagram" value="'+esc(s.links.instagram||'')+'"></label><label>YouTube<input id="f-youtube" value="'+esc(s.links.youtube||'')+'"></label><label>TikTok<input id="f-tiktok" value="'+esc(s.links.tiktok||'')+'"></label>'
  +'<p class="sub">Los cambios se ven públicos solo después de “Guardar y publicar”.</p></section>';
}
function readCover(file,cb){var r=new FileReader();r.onload=function(){var im=new Image();im.onload=function(){var c=document.createElement('canvas');c.width=c.height=220;var x=c.getContext('2d'),m=Math.min(im.width,im.height);x.drawImage(im,(im.width-m)/2,(im.height-m)/2,m,m,0,0,220,220);cb(c.toDataURL('image/jpeg',.78))};im.src=r.result};r.readAsDataURL(file)}
function autoCover(t){var c=document.createElement('canvas');c.width=c.height=220;var x=c.getContext('2d');var g=x.createLinearGradient(0,0,220,220);g.addColorStop(0,'#2a0505');g.addColorStop(1,'#0b0707');x.fillStyle=g;x.fillRect(0,0,220,220);x.fillStyle='#e5251b';x.fillRect(0,196,220,6);x.fillStyle='#fff';x.font='34px Anton,Impact,sans-serif';x.textBaseline='top';var w=String(t).toUpperCase().split(' '),ln=[],cur='';w.forEach(function(a){var tt=cur?cur+' '+a:a;if(x.measureText(tt).width>190&&cur){ln.push(cur);cur=a}else cur=tt});ln.push(cur);ln.slice(0,4).forEach(function(l,i){x.fillText(l,16,18+i*38)});x.fillStyle='#e5251b';x.font='16px Archivo,Arial,sans-serif';x.fillText('XABDIELL',16,170);return c.toDataURL('image/jpeg',.8)}
function build(s){
  var css=document.getElementById('css').textContent,app=document.getElementById('app').textContent;
  var json=JSON.stringify(s).replace(/</g,'\\u003c');
  return '<!DOCTYPE html>\n<html lang="es"><head>'+HEAD+'<style id="css">'+css+'</style></head><body><div id="root"></div><script type="application/json" id="data">'+json+'<\/script><script id="app">'+app+'<\/script></body></html>';
}
async function addSong(){
  readSettings();
  var kind=val('n-kind'),t=val('n-title'),u=val('n-url'),mode=val('n-mode'),amt=val('n-amt'),f=document.getElementById('n-audio').files[0];
  if(!t){setMsg('Falta el título');return}
  if(kind==='lanzada'&&!/^https?:\/\//i.test(u||'')){setMsg('Falta el link (debe empezar con https://)');return}
  if(u&&!/^https?:\/\//i.test(u)){setMsg('El link debe empezar con https://');return}
  if(mode==='fijo'&&!(+amt>0)){setMsg('Pon el monto del precio fijo');return}
  if((mode==='fijo'||mode==='libre')&&!state.paypal){setMsg('Primero escribe tu usuario de PayPal en Ajustes (más abajo en este panel)');return}
  var audio='';
  if(f&&mode!=='fijo'){
    var A=null;
    try{A=window.claude&&await claude.use('assets')}catch(e){}
    if(A){try{setMsg('Subiendo audio…');var r=await A.upload(f);audio=r.url}catch(e){audio=''}}
    if(!audio){
      if(f.size>5*1024*1024){setMsg('No se pudo subir el audio y pesa más de 5 MB. Pega un link (SoundCloud o Drive) o usa un archivo más ligero');return}
      setMsg('Guardando el audio dentro de la página…');
      audio=await new Promise(function(ok){var fr=new FileReader();fr.onload=function(){ok(fr.result)};fr.onerror=function(){ok('')};fr.readAsDataURL(f)});
      if(!audio){setMsg('No se pudo leer el audio');return}
    }
  }
  state.songs.push({id:Date.now(),kind:kind,title:t,artist:val('n-artist'),date:val('n-date')||'',url:u||'',cover:draftCover||autoCover(t),audio:audio,price:mode&&mode!=='ninguno'?{mode:mode,amount:mode==='fijo'?amt:'',cur:val('n-cur')}:null});
  draftCover='';msgText='Canción añadida. Falta publicar';render();
}
async function save(){
  readSettings();
  try{
    var a=window.claude&&await claude.use('artifact');
    if(!a){setMsg('No se puede guardar desde aquí');return}
    setMsg('Publicando…');
    var html=build(state);if(html.length>15500000){setMsg('La página pesa demasiado: quita audios pesados o usa links');return}await a.publish(html);
  }catch(e){
    setMsg(e&&e.code==='conflict'?'Hay una versión más nueva; se recargará':e&&e.code==='too_large'?'Demasiado grande: usa portadas más ligeras':e&&(e.code==='not_writer'||e.code==='not_granted')?'Para publicar, abre la página con tu cuenta de Claude (la dueña)':'No se pudo publicar, intenta de nuevo');
  }
}
root.addEventListener('click',function(e){
  var b=e.target.closest('button[data-act]');if(!b)return;
  var act=b.dataset.act,id=+b.dataset.id;
  if(act==='code'){codeOpen=true;render();var ci=document.getElementById('code-in');if(ci)ci.focus();return}
  if(act==='unlock'){sha(val('code-in')||'').then(function(h){if(h===HASH){canEdit=true;editing=true;codeOpen=false;msgText='Modo editor activado';render()}else{var ci=document.getElementById('code-in');if(ci){ci.value='';ci.placeholder='Código incorrecto'}}});return}
  if(act==='toggle'){readSettings();editing=!editing;msgText='';render();return}
  if(act==='save'){save();return}
  if(act==='add'){addSong();return}
  readSettings();
  if(act==='del'){if(!confirm('¿Borrar esta canción?'))return;state.songs=state.songs.filter(function(g){return g.id!==id});msgText='Falta publicar';render()}
});
root.addEventListener('change',function(e){
  var t=e.target;
  if(t.dataset.cover!==undefined&&t.files[0]){var id=+t.dataset.cover;readCover(t.files[0],function(d){state.songs.forEach(function(g){if(g.id===id)g.cover=d});msgText='Portada cambiada. Falta publicar';render()});return}
  if(t.id==='n-cover'&&t.files[0])readCover(t.files[0],function(d){draftCover=d;var p=document.getElementById('n-prev');p.src=d;p.hidden=false});
});
render();
})();
</script></body></html>
